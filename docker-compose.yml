version: '3.9'
services:
  nats:
    image: nats:latest
    ports: ["4222:4222"]

  redis:
    image: redis:alpine

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686", "4318:4318"]

  orchestrator:
    build: ./orchestrator
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - JAEGER_URL=http://jaeger:4318
    depends_on: [nats, redis, jaeger]
    ports: ["8000:8000"]

  triage-agent:
    build: ./agents/triage
    environment: [NATS_URL=nats://nats:4222, REDIS_URL=redis://redis:6379]

  appointment-agent:
    build: ./agents/appointment
    environment: [NATS_URL=nats://nats:4222]

  reminder-agent:
    build: ./agents/reminder
    environment: [NATS_URL=nats://nats:4222]

  feedback-agent:
    build: ./agents/feedback
    environment: [NATS_URL=nats://nats:4222]

  llm-agent:
    build: ./agents/llm
    environment: [NATS_URL=nats://nats:4222]