services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LOG_FILE=/app/logs/orchestrator.log
      - COMPOSE_FILE=/workspace/docker-compose.yml
      - COMPOSE_PROJECT_NAME=lab13_mas
      - AUTOSCALE_ENABLED=true
    volumes:
      - orchestrator-logs:/app/logs
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nats
      - jaeger
      - redis

  triage-agent:
    build: ./agents/triage
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=triage-agent
      - LOG_FILE=/app/logs/triage.log
    volumes:
      - agent-logs:/app/logs
    depends_on:
      - nats
      - jaeger

  appointment-agent:
    build: ./agents/appointment
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=appointment-agent
      - AGENT_ID=appointment-agent
      - AGENT_COST=3
      - AGENT_SKILL=0.95
      - LOG_FILE=/app/logs/appointment-1.log
    volumes:
      - agent-logs:/app/logs
    depends_on:
      - nats
      - jaeger

  appointment-agent-2:
    build: ./agents/appointment
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=appointment-agent-2
      - AGENT_ID=appointment-agent-2
      - AGENT_COST=1
      - AGENT_SKILL=0.80
      - LOG_FILE=/app/logs/appointment-2.log
    volumes:
      - agent-logs:/app/logs
    depends_on:
      - nats
      - jaeger

  reminder-agent:
    build: ./agents/reminder
    environment:
      - NATS_URL=nats://nats:4222
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=reminder-agent
      - LOG_FILE=/app/logs/reminder.log
    volumes:
      - agent-logs:/app/logs
    depends_on:
      - nats
      - jaeger

  feedback-agent:
    build: ./agents/feedback
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_ADDR=redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=feedback-agent
      - LOG_FILE=/app/logs/feedback.log
    volumes:
      - agent-logs:/app/logs
    depends_on:
      - nats
      - redis
      - jaeger

  llm-agent:
    build: ./agents/llm
    environment:
      - NATS_URL=nats://nats:4222
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - LOG_FILE=/app/logs/llm.log
    volumes:
      - agent-logs:/app/logs
    depends_on:
      - nats

volumes:
  orchestrator-logs:
  agent-logs:
  ollama-data:
