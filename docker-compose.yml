version: '3.9'

services:

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4318:4318"

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    depends_on:
      - nats
      - redis
      - jaeger
    environment:
      - NATS_URL=nats://nats:4222

  appointment-agent:
    build:
      context: .
      dockerfile: agents/appointment/Dockerfile
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222

  reminder-agent:
    build:
      context: .
      dockerfile: agents/reminder/Dockerfile
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222

  feedback-agent:
    build:
      context: .
      dockerfile: agents/feedback/Dockerfile
    depends_on:
      - nats
      - redis
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_ADDR=redis:6379

  triage-agent:
    build:
      context: .
      dockerfile: agents/triage/Dockerfile
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222